name: Build and Release

on:
  push:
    branches:
      - 'release/v*.*.*'

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux x64
            platform: linux-x64
          - os: ubuntu-24.04-arm
            label: Linux ARM64
            platform: linux-arm64
          - os: windows-latest
            label: Windows x64
            platform: windows-x64
          - os: windows-11-arm
            label: Windows ARM64
            platform: windows-arm64

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from branch
        id: version
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          VERSION="${BRANCH_NAME#release/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 Version: ${VERSION}"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'

      - name: Init
        run: uv run dev.py init

      - name: Build
        shell: bash
        run: uv run dev.py build

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="AutoBingWallpaper-${VERSION}-${{ matrix.platform }}"
          mkdir -p release
          cp "dist/每日bing壁纸" "release/"
          cp "assets/icon.svg" "release/"
          tar -czf "${ARTIFACT}.tar.gz" -C release "每日bing壁纸" "icon.svg"

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="AutoBingWallpaper-${VERSION}-${{ matrix.platform }}"
          mv "dist/每日bing壁纸.exe" "${ARTIFACT}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AutoBingWallpaper-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: AutoBingWallpaper-${{ steps.version.outputs.version }}-${{ matrix.platform }}.*
          if-no-files-found: error

  create-release:
    name: Create Release Draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from branch
        id: version
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          VERSION="${BRANCH_NAME#release/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets/

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Generate changelog
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "v${{ steps.version.outputs.version }}" | head -1)

          echo "## 🆕 更新内容" > release-body.md
          echo "" >> release-body.md

          if [ -n "$PREV_TAG" ]; then
            echo "**对比 ${PREV_TAG} → v${{ steps.version.outputs.version }}**" >> release-body.md
            echo "" >> release-body.md

            # 分类输出 commits
            echo "### ✨ 新功能" >> release-body.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --grep="^feat" --no-merges >> release-body.md || echo "- 无" >> release-body.md
            echo "" >> release-body.md
            echo "" >> release-body.md

            echo "### 🐛 修复" >> release-body.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --grep="^fix" --no-merges >> release-body.md || echo "- 无" >> release-body.md
            echo "" >> release-body.md
            echo "" >> release-body.md

            echo "### 🔧 其他" >> release-body.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --grep="^\(chore\|refactor\|docs\|style\|perf\|ci\|test\|build\)" --no-merges >> release-body.md || echo "- 无" >> release-body.md
          else
            echo "**首个正式版本**" >> release-body.md
            echo "" >> release-body.md
            git log --pretty=format:"- %s (%h)" --no-merges >> release-body.md
          fi

          echo "" >> release-body.md
          echo "---" >> release-body.md
          echo "" >> release-body.md
          echo "## 📥 下载" >> release-body.md
          echo "" >> release-body.md
          echo "| 平台 | 文件 |" >> release-body.md
          echo "|------|------|" >> release-body.md
          echo "| 🐧 Linux x64 | \`AutoBingWallpaper-\${{ steps.version.outputs.version }}-linux-x64.tar.gz\` |" >> release-body.md
          echo "| 🐧 Linux ARM64 | \`AutoBingWallpaper-\${{ steps.version.outputs.version }}-linux-arm64.tar.gz\` |" >> release-body.md
          echo "| 🪟 Windows x64 | \`AutoBingWallpaper-\${{ steps.version.outputs.version }}-windows-x64.exe\` |" >> release-body.md
          echo "| 🪟 Windows ARM64 | \`AutoBingWallpaper-\${{ steps.version.outputs.version }}-windows-arm64.exe\` |" >> release-body.md

      - name: Create Release Draft
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: true
          files: release-assets/*
          generate_release_notes: true
          body_path: release-body.md
          append_body: true
