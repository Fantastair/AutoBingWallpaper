name: Build and Release

on:
  push:
    branches:
      - 'release/v*.*.*'

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux x64
            platform: linux-x64
          - os: ubuntu-24.04-arm
            label: Linux ARM64
            platform: linux-arm64
          - os: windows-latest
            label: Windows x64
            platform: windows-x64
          - os: windows-11-arm
            label: Windows ARM64
            platform: windows-arm64

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from branch
        id: version
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          VERSION="${BRANCH_NAME#release/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 Version: ${VERSION}"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'

      - name: Init
        run: uv run dev.py init

      - name: Build
        shell: bash
        run: uv run dev.py build

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="AutoBingWallpaper-${VERSION}-${{ matrix.platform }}"
          mkdir -p release
          cp "dist/每日bing壁纸" "release/"
          cp "assets/icon.svg" "release/"
          tar -czf "${ARTIFACT}.tar.gz" -C release "每日bing壁纸" "icon.svg"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $ARTIFACT = "AutoBingWallpaper-${VERSION}-${{ matrix.platform }}"
          New-Item -ItemType Directory -Path release -Force
          Copy-Item "dist/每日bing壁纸.exe" "release/"
          Compress-Archive -Path "release/每日bing壁纸.exe" -DestinationPath "${ARTIFACT}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AutoBingWallpaper-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: AutoBingWallpaper-${{ steps.version.outputs.version }}-${{ matrix.platform }}.*
          if-no-files-found: error

  create-release:
    name: Create Release Draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from branch
        id: version
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          VERSION="${BRANCH_NAME#release/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets/

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create Release Draft
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: true
          files: release-assets/*
          generate_release_notes: true
